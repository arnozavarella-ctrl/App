<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F0F0F" />
    <meta name="description" content="LevelUp — Gamifie tes habitudes fitness et bien-être. Monte en niveau, débloques des badges et deviens une légende." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LevelUp" />

    <!-- Open Graph -->
    <meta property="og:title" content="LevelUp — Gamifie tes habitudes" />
    <meta property="og:description" content="Monte en niveau, débloque des badges et deviens une légende de tes habitudes !" />
    <meta property="og:type" content="website" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />

    <title>LevelUp ⚡ — Gamifie tes habitudes</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Enregistrement du Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Service Worker enregistré :', reg.scope))
            .catch(err => console.error('Erreur SW :', err));
        });
      }
    </script>
  </body>
</html>
